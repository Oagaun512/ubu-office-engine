[package]
name = "ubu-docx"
description = "Headless DOCX engine for Ubu Office: open, lay out, render, extract text, export PDF, save"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the browser build (wasm-bindgen); rlib: native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-pdf = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

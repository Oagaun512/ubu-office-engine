# The spreadsheet engine's own workspace (Ubu Office Phase 4, S1; decision D18).
#
# Separate from the PDF engine's workspace (the root) and the DOCX engine's (`docx/`), as D16
# set out: each upstream keeps its own dependency graph and Cargo.lock. gridcraft's headless
# crates need no patches (no git dependencies, no krilla), so there is no [patch] section here.
[workspace]
resolver = "3"
members = ["ubu-sheets"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Oagaun512/ubu-office-engine"
publish = false

[workspace.dependencies]
gridcraft-engine = { path = "../upstream/gridcraft/crates/engine" }
gridcraft-chart = { path = "../upstream/gridcraft/crates/chart" }
gridcraft-xlsx = { path = "../upstream/gridcraft/crates/xlsx" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The corpus round-trip runner (S2): optimised like a release build and, like the browser build,
# panic = "abort", so a workbook that panics shows up as a crash. Thin LTO keeps the build quick.
[profile.corpus]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "none"

# Native test runs: optimised dependencies keep recalculation in the tests fast.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

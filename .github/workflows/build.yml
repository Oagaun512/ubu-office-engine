name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (patches, fmt, clippy, wasm dependency tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - name: Patches match pdfcraft's
        run: node scripts/check-patches.mjs
      - name: Forks are unmodified at their pinned commits
        run: |
          git submodule status
          for d in upstream/*; do
            test -z "$(git -C "$d" status --porcelain)" || { echo "::error::$d has local changes"; exit 1; }
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: wasm32 clippy (covers the wasm-bindgen layer)
        run: cargo clippy --locked -p ubu-pdf --target wasm32-unknown-unknown -- -D warnings
      - name: wasm32 dependency report
        run: |
          {
            echo "### wasm32 dependency tree: ubu-pdf"
            for c in getrandom rayon tokio; do
              hits=$(cargo tree --locked -p ubu-pdf --target wasm32-unknown-unknown -e normal -i "$c" 2>/dev/null | head -1 || true)
              echo "- \`$c\`: ${hits:-not in the tree}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --locked -p ubu-pdf

  wasm:
    name: wasm build, bindings, size, export check
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN_VERSION: 0.2.129 # must equal the wasm-bindgen crate version in Cargo.lock
      BINARYEN_VERSION: version_133
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: Install binaryen (wasm-opt)
        run: |
          base=https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION
          file=binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz
          curl -sSfLO "$base/$file" && curl -sSfLO "$base/$file.sha256"
          sha256sum -c "$file.sha256"
          tar xzf "$file"
          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Lockfile and CLI agree on wasm-bindgen
        run: |
          locked=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          test "$locked" = "$WASM_BINDGEN_VERSION" || { echo "::error::Cargo.lock has wasm-bindgen $locked, CI installs $WASM_BINDGEN_VERSION"; exit 1; }
      - name: cargo build (wasm32, release)
        env:
          UBU_ENGINE_COMMIT: ${{ github.sha }}
        run: |
          export UBU_PDF_UPSTREAM_COMMIT=$(git -C upstream/pdfcraft rev-parse HEAD)
          cargo build --locked --release -p ubu-pdf --target wasm32-unknown-unknown
      - name: wasm-bindgen --target web
        run: wasm-bindgen target/wasm32-unknown-unknown/release/ubu_pdf.wasm --target web --typescript --out-dir pkg
      - name: wasm-opt -Oz
        run: |
          cp pkg/ubu_pdf_bg.wasm pkg/ubu_pdf_bg.unopt.wasm
          wasm-opt -Oz --strip-debug --strip-producers \
            --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext \
            --enable-mutable-globals --enable-reference-types --enable-multivalue \
            pkg/ubu_pdf_bg.unopt.wasm -o pkg/ubu_pdf_bg.wasm
      - name: Size report
        run: |
          {
            echo "## ubu-pdf sizes"
            echo
            node scripts/size-report.mjs pkg/ubu_pdf_bg.wasm pkg/ubu_pdf.js
            echo
            echo "Before wasm-opt: $(stat -c %s pkg/ubu_pdf_bg.unopt.wasm) B"
          } | tee pkg/SIZE.md >> "$GITHUB_STEP_SUMMARY"
          rm pkg/ubu_pdf_bg.unopt.wasm
      - name: Export check (bindings vs contract, exports, browser-safe imports)
        run: node scripts/check-exports.mjs pkg ubu_pdf contract/ubu_pdf.d.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubu-pdf-pkg
          path: pkg/
          if-no-files-found: error

  licences:
    name: licence gate and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (licences, bans, sources)
        run: cargo deny --locked check licenses bans sources
      - name: SBOM.md (fails on copyleft, unknown licence or unexpected source)
        run: |
          mkdir -p out
          node scripts/sbom.mjs ubu-pdf > out/SBOM.md
          {
            echo "## SBOM"
            sed -n 's/^\([0-9]*\) packages\.$/\1 packages linked into the browser build, all permissive./p' out/SBOM.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Licence texts
        run: node scripts/licenses.mjs ubu-pdf out/LICENSES
      - uses: actions/upload-artifact@v4
        with:
          name: ubu-pdf-licences
          path: out/
          if-no-files-found: error

  roundtrip:
    name: round trip on the pdf.js corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: roundtrip
      - name: Fetch corpus (pinned)
        run: sh scripts/fetch-corpus.sh
      - name: Build the round-trip runner (panic = abort, as in the browser)
        run: cargo build --locked --profile corpus -p ubu-pdf --example roundtrip
      - name: Run
        run: |
          mkdir -p out
          node scripts/roundtrip.mjs target/corpus/examples/roundtrip corpus/cache/pdfjs/test/pdfs corpus/cache/pdfjs/test/test_manifest.json > out/ROUNDTRIP.md
          sed -n '/^- Files/,/^$/p' out/ROUNDTRIP.md | sed '1i ## Round trip (pdf.js corpus)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ubu-pdf-roundtrip
          path: out/ROUNDTRIP.md
          if-no-files-found: error

  bundle:
    name: assemble the Ubunex artifact bundle
    needs: [check, test, wasm, licences, roundtrip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble dist/pdf
        env:
          WASM_BINDGEN_VERSION: 0.2.129
          BINARYEN_VERSION: version_133
        run: |
          d=dist/pdf
          mkdir -p "$d"
          cp artifacts/ubu-pdf-pkg/ubu_pdf.js artifacts/ubu-pdf-pkg/ubu_pdf.d.ts \
             artifacts/ubu-pdf-pkg/ubu_pdf_bg.wasm artifacts/ubu-pdf-pkg/ubu_pdf_bg.wasm.d.ts \
             artifacts/ubu-pdf-pkg/SIZE.md "$d/"
          cp artifacts/ubu-pdf-licences/SBOM.md "$d/"
          cp -r artifacts/ubu-pdf-licences/LICENSES "$d/"
          cp artifacts/ubu-pdf-roundtrip/ROUNDTRIP.md "$d/"
          cp NOTICE "$d/NOTICE"
          {
            echo "engine: Oagaun512/ubu-office-engine@${GITHUB_SHA}"
            echo "pdf engine fork: Oagaun512/pdfcraft@$(git -C upstream/pdfcraft rev-parse HEAD) (upstream: storytold/pdfcraft)"
            echo "craft-libs fork: Oagaun512/craft-libs@$(git -C upstream/craft-libs rev-parse HEAD) (upstream: storytold/craft-libs)"
            echo "rustc: $(rustc --version)"
            echo "wasm-bindgen: ${WASM_BINDGEN_VERSION}"
            echo "binaryen: ${BINARYEN_VERSION}"
            echo "ci run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$d/VERSION"
          cat > "$d/README.md" <<'MD'
          # Ubu Office PDF engine (generated)

          Built artifacts of the headless PDF engine from
          [Oagaun512/ubu-office-engine](https://github.com/Oagaun512/ubu-office-engine).
          **Do not edit these files.** They are replaced by the engine's CI on every engine release.

          - `ubu_pdf.js`, `ubu_pdf.d.ts`: the wasm-bindgen glue and its types (`--target web`)
          - `ubu_pdf_bg.wasm`: the engine
          - `VERSION`: the exact commits and tool versions that produced them
          - `SBOM.md`, `LICENSES/`, `NOTICE`: what is inside and under which licences
          - `SIZE.md`, `ROUNDTRIP.md`: measured size and the corpus round-trip report
          MD
          sed -i 's/^          //' "$d/README.md"
          find dist -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: ubunex-vendor-ubu-office
          path: dist/
          if-no-files-found: error

  publish:
    name: open the artifact PR into Ubunex
    needs: [bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The token lives in this environment, which only `main` may deploy to: even an edited
    # workflow on another branch cannot read it. Pull requests never reach this job.
    environment: ubunex-publish
    runs-on: ubuntu-latest
    env:
      UBUNEX_PR_TOKEN: ${{ secrets.UBUNEX_PR_TOKEN }}
    steps:
      - name: Token present?
        id: token
        run: |
          if [ -z "$UBUNEX_PR_TOKEN" ]; then
            echo "::notice::UBUNEX_PR_TOKEN is not set; skipping the Ubunex PR. Download the ubunex-vendor-ubu-office artifact instead."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true'
        with:
          name: ubunex-vendor-ubu-office
          path: dist
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: Oagaun512/ubunex
          token: ${{ secrets.UBUNEX_PR_TOKEN }}
          path: ubunex
      - name: Commit and open or update the PR
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.UBUNEX_PR_TOKEN }}
        run: |
          short=${GITHUB_SHA::7}
          branch=ubu-office/pdf-engine
          cd ubunex
          git config user.name "ubu-office-engine CI"
          git config user.email "129573250+Oagaun512@users.noreply.github.com"
          git checkout -B "$branch"
          rm -rf src/vendor/ubu-office/pdf
          mkdir -p src/vendor/ubu-office
          cp -r ../dist/pdf src/vendor/ubu-office/pdf
          git add -A src/vendor/ubu-office/pdf
          if git diff --cached --quiet origin/main -- src/vendor/ubu-office/pdf; then
            echo "Ubunex already vendors this build; nothing to do."
            exit 0
          fi
          old=$(git show origin/main:src/vendor/ubu-office/pdf/ubu_pdf_bg.wasm 2>/dev/null | wc -c)
          new=$(wc -c < src/vendor/ubu-office/pdf/ubu_pdf_bg.wasm)
          sbom=$(git diff --cached --stat origin/main -- src/vendor/ubu-office/pdf/SBOM.md | tail -1)
          git commit -q -m "Vendor Ubu Office PDF engine ${short}" -m "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push -q --force origin "$branch"
          {
            echo "Vendors the Ubu Office PDF engine built from Oagaun512/ubu-office-engine@${GITHUB_SHA}. Generated files only."
            echo
            echo '```'
            cat src/vendor/ubu-office/pdf/VERSION
            echo '```'
            echo
            echo "**wasm size:** ${old} B → ${new} B"
            echo
            cat src/vendor/ubu-office/pdf/SIZE.md
            echo
            echo "**SBOM change:** ${sbom:-none}"
            echo
            sed -n '/^- Files/,/^$/p' src/vendor/ubu-office/pdf/ROUNDTRIP.md
            echo
            echo "Verify before merging: \`npm run typecheck\`, \`npm run build\`, \`npm run test:unit\`."
          } > ../body.md
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "Vendor Ubu Office PDF engine ${short}" --body-file ../body.md
          else
            gh pr create --base main --head "$branch" --title "Vendor Ubu Office PDF engine ${short}" --body-file ../body.md
          fi

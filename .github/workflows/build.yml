name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (patches, fmt, clippy, wasm dependency tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - name: Patches match pdfcraft's
        run: node scripts/check-patches.mjs
      - name: Forks are unmodified at their pinned commits
        run: |
          git submodule status
          for d in upstream/*; do
            test -z "$(git -C "$d" status --porcelain)" || { echo "::error::$d has local changes"; exit 1; }
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: wasm32 compile check
        run: cargo check --locked -p ubu-pdf --target wasm32-unknown-unknown
      - name: wasm32 dependency report
        run: |
          {
            echo "### wasm32 dependency tree: ubu-pdf"
            for c in getrandom rayon tokio; do
              hits=$(cargo tree --locked -p ubu-pdf --target wasm32-unknown-unknown -e normal -i "$c" 2>/dev/null | head -1 || true)
              echo "- \`$c\`: ${hits:-not in the tree}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --locked -p ubu-pdf

[package]
name = "ubu-pdf"
description = "Headless PDF engine for Ubu Office: open, render, extract text, save"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the browser build (wasm-bindgen); rlib: native tests and the corpus run.
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfcraft-render = { workspace = true }
pdfcraft-cos = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
